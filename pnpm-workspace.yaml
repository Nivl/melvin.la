packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  msw: false
  sharp: false
blockExoticSubdeps: true
catalog:
  "@chromatic-com/storybook": 5.3.1
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  "@internationalized/date": 3.12.4
  "@lingual/i18n-check": 0.9.5
  "@msw/playwright": 0.6.7
  "@next/bundle-analyzer": 16.3.6
  "@playwright/test": 1.63.0
  "@radix-ui/react-toggle-group": 1.1.19
  "@sentry/nextjs": 11.0.0
  "@storybook/addon-docs": 10.6.0
  "@storybook/addon-links": 10.6.0
  "@storybook/addon-themes": 10.6.0
  "@storybook/nextjs": 10.6.0
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-query": 5.104.0
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "@types/node": 26.6.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vercel/analytics": 2.0.1
  "@vercel/speed-insights": 2.0.0
  "@vis.gl/react-google-maps": 1.10.1
  "@vitejs/plugin-react": 6.1.1
  city-timezones: 1.3.4
  es-toolkit: 1.52.0
  eslint-plugin-playwright: 2.12.0
  eslint-plugin-simple-import-sort: 14.0.0
  gray-matter: 4.0.3
  jsdom: 30.1.1
  knip: 6.38.0
  lucide-react: 1.48.0
  motion: 14.3.0
  msw: 3.0.3
  next: 16.3.6
  next-intl: 4.14.7
  next-mdx-remote: 6.0.0
  oxfmt: 0.70.0
  oxlint: 1.80.0
  oxlint-tsgolint: 7.0.2003
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  react-icons: 5.7.0
  rehype-pretty-code: 0.14.5
  server-only: 0.0.1
  shiki: 4.4.3
  storybook: 10.6.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.4
  typescript: 7.0.2
  use-debounce: 10.1.1
  uuid: 14.0.2
  vitest: 5.0.5
  vitest-canvas-mock: 1.2.0
  zod: 4.6.5

# Catalog configuration
catalogMode: "strict"
cleanupUnusedCatalogs: true

# Supply chain attack mitigation
ignoredBuiltDependencies:
  - canvas
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
  - "@swc/core"
  - "msw"
  - "@sentry/cli"
  - "@parcel/watcher"

minimumReleaseAge: 20160
optimisticRepeatInstall: true
saveExact: true
strictDepBuilds: true

#trustPolicy: "no-downgrade"
trustPolicyExclude:
  # Nested deps from @storybook/nextjs@10.3.5
  - "semver@6.3.1"
  - "chokidar@4.0.3"
verifyDepsBeforeRun: "install"
