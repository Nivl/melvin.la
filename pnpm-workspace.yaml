packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  msw: false
  sharp: false
blockExoticSubdeps: true
catalog:
  "@chromatic-com/storybook": 5.3.0
  "@heroui/react": 3.2.4
  "@heroui/styles": 3.2.4
  "@internationalized/date": 3.12.3
  "@lingual/i18n-check": 0.9.5
  "@msw/playwright": 0.6.7
  "@next/bundle-analyzer": 16.3.2
  "@playwright/test": 1.62.1
  "@radix-ui/react-toggle-group": 1.1.19
  "@sentry/nextjs": 10.70.0
  "@storybook/addon-docs": 10.5.10
  "@storybook/addon-links": 10.5.10
  "@storybook/addon-themes": 10.5.10
  "@storybook/nextjs": 10.5.10
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-query": 5.101.4
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.5
  "@trpc/client": 11.18.0
  "@trpc/server": 11.18.0
  "@trpc/tanstack-react-query": 11.18.0
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@vercel/analytics": 2.0.1
  "@vercel/speed-insights": 2.0.0
  "@vis.gl/react-google-maps": 1.9.0
  "@vitejs/plugin-react": 6.1.0
  city-timezones: 1.3.4
  es-toolkit: 1.51.0
  eslint-plugin-playwright: 2.11.0
  eslint-plugin-simple-import-sort: 14.0.0
  gray-matter: 4.0.3
  jsdom: 30.0.1
  knip: 6.32.2
  lucide-react: 1.33.0
  motion: 13.1.1
  msw: 2.15.0
  next: 16.3.2
  next-intl: 4.13.7
  next-mdx-remote: 6.0.0
  oxfmt: 0.64.0
  oxlint: 1.79.0
  oxlint-tsgolint: 7.0.2001
  postcss: 8.5.26
  react: 19.2.8
  react-dom: 19.2.8
  react-icons: 5.7.0
  rehype-pretty-code: 0.14.5
  server-only: 0.0.1
  shiki: 4.4.3
  storybook: 10.5.10
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  tsx: 4.23.12
  turbo: 2.10.11
  typescript: 7.0.2
  use-debounce: 10.1.1
  uuid: 14.0.2
  vitest: 4.1.11
  vitest-canvas-mock: 1.1.5
  zod: 4.4.3

# Catalog configuration
catalogMode: "strict"
cleanupUnusedCatalogs: true

# Supply chain attack mitigation
ignoredBuiltDependencies:
  - canvas
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
  - "@swc/core"
  - "msw"
  - "@sentry/cli"
  - "@parcel/watcher"

minimumReleaseAge: 20160
optimisticRepeatInstall: true
saveExact: true
strictDepBuilds: true

trustPolicy: "no-downgrade"
trustPolicyExclude:
  # Nested deps from @storybook/nextjs@10.3.5
  - "semver@6.3.1"
  - "chokidar@4.0.3"
verifyDepsBeforeRun: "install"
